<script>
    const repoBase = 'Text-Analytics-and-Retrieval/SMA_2026S';
    const groupLabels = ['', '第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組', '第八組', '第九組', '第十組', '第十一組', '第十二組', '第十三組', '第十四組', '第十五組', '第十六組', '第十七組', '第十八組', '第十九組', '第二十組', '第二十一組', '第二十二組', '第二十三組', '第二十四組', '第二十五組', '第二十六組', '第二十七組'];

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, function (char) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
    }

    function fileHref(file) {
        const path = encodeURI(file.path || '');
        if ((file.type || '').toLowerCase() === 'ipynb') {
            return `https://github.com/${repoBase}/blob/main/${path}`;
        }
        if (['pdf', 'doc', 'docx', 'ppt', 'pptx'].includes((file.type || '').toLowerCase())) {
            return `https://docs.google.com/viewer?url=https://github.com/${repoBase}/raw/main/${path}`;
        }
        return `https://github.com/${repoBase}/raw/main/${path}`;
    }

    function fileButtonClass(file) {
        return (file.type || '').toLowerCase() === 'ipynb' ? 'btn-outline-danger' : 'btn-outline-primary';
    }

    function renderFileLinks(files) {
        if (!files || files.length === 0) {
            return '';
        }
        return files.map(function (file) {
            return `<a href="${fileHref(file)}" target="_blank"><button type="button" class="btn ${fileButtonClass(file)} btn-sm">${escapeHtml(file.label || file.type || 'file')}</button></a>`;
        }).join(' ');
    }

    function renderTopic(item, showVideo) {
        const topic = escapeHtml(item.topic_name || '');
        if (!showVideo || !item.video_url) {
            return topic;
        }
        return `${topic} <a href="${escapeHtml(item.video_url)}" target="_blank"><i class="fa fa-youtube-play" style="font-size:24px"></i></a>`;
    }

    function renderRows(items, showVideo) {
        return items.map(function (item) {
            return `<tr><td>${escapeHtml(item.group_name || groupLabels[item.group] || '')}</td><td>${renderTopic(item, showVideo)}</td><td>${renderFileLinks(item.files)}</td><td>${escapeHtml((item.members || []).join('、'))}</td></tr>`;
        }).join('');
    }

    function loadTable(dataUrl, bodyId, showVideo) {
        fetch(dataUrl)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error(`Unable to load ${dataUrl}`);
                }
                return response.json();
            })
            .then(function (items) {
                document.getElementById(bodyId).innerHTML = renderRows(items, showVideo);
            })
            .catch(function () {
                document.getElementById(bodyId).innerHTML = '<tr><td colspan="4"></td></tr>';
            });
    }

    loadTable('1st_study_group_data.json', 'study-group-1st-body', false);
    loadTable('2nd_study_group_data.json', 'study-group-2nd-body', false);
    loadTable('3rd_study_group_data.json', 'study-group-3rd-body', false);
    loadTable('data.json', 'final-project-body', true);
</script>
